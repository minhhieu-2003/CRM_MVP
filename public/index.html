<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BankRM Copilot - CRM AI Agent</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>BankRM Copilot</h1>
        <p>AI Agent CRM cho Relationship Manager (Tiếng Việt)</p>
      </header>

      <section id="chatWindow" class="chat-window"></section>

      <form id="chatForm" class="composer">
        <input
          id="messageInput"
          type="text"
          placeholder="Ví dụ: Nhắc tôi những khách hàng có tiết kiệm đến hạn trong tuần này"
          required
        />
        <button type="submit">Gửi</button>
      </form>
    </main>

    <script src="/config.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
